name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: bash build/check-versions.sh

      - id: version
        run: echo "version=$(grep -o 'AppVersion *= *"[^"]*"' internal/constants/app.go | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install wails3 and NSIS
        run: |
          # CGO off: the CLI pulls in a GTK4 probe that does not build on the runner.
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          sudo apt-get update
          sudo apt-get install -y nsis

      - run: bash build/release-windows.sh

      - uses: actions/attest@v4
        with:
          subject-path: bin/Tetiva-*-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: bin/Tetiva-*-installer.exe
          if-no-files-found: error

  smoke:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-installers

      - run: ./build/windows/smoke.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }}
