name: "tetiva"
arch: ${GOARCH}
platform: "linux"
version: "1.1.0"
section: "devel"
priority: "optional"
maintainer: "Saveliy Yudin <support@tetiva.app>"
description: "Tetiva — API client for HTTP, gRPC, GraphQL and WebSocket"
vendor: "Saveliy Yudin"
homepage: "https://tetiva.app"
license: "MIT"
release: "1"

contents:
  - src: "./bin/client"
    dst: "/usr/bin/tetiva"
  # 512x512 is the largest size hicolor's index.theme knows about; appicon.png (1024) would never be looked up.
  - src: "./build/linux/tetiva.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/tetiva.png"
  - src: "./build/linux/tetiva.desktop"
    dst: "/usr/share/applications/tetiva.desktop"

# GTK3 + WebKit2GTK 4.1 stack, matching the `gtk3` build tag.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
