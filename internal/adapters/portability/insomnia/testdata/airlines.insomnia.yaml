      sortKey: -1661942202873
    settings:
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
    authentication:
      type: bearer
      token: "{{ _.auth_token }}"
      disabled: false
    headers:
      - name: X-Gate
        value: B12
  - url: localhost:50051
    name: Route chat
    meta:
      id: greq_85d23a4f6a50465cac85791fd8652046
