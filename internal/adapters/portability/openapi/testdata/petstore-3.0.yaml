openapi: 3.0.3
info:
  title: Petstore
  description: A sample pet store.
  version: 1.4.0
servers:
  - url: https://{env}.petstore.example.com/api/v3/
    variables:
      env:
        default: api
tags:
  - name: pet
    description: Everything about your pets
  - name: user
    description: Operations about users
  - name: store
    description: Access to orders
security:
  - api_key: []
paths:
  /pets:
    get:
      tags: [pet]
      summary: List pets
      description: Returns pets by status.
      parameters:
        - name: limit
          in: query
          description: How many pets to return
          schema: {type: integer, example: 20}
        - name: status
          in: query
          required: true
          schema:
            type: array
            items: {type: string, enum: [available, pending, sold], default: available}
        - name: X-Request-ID
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: Accept
          in: header
          schema: {type: string, example: application/json}
        - name: Authorization
          in: header
          required: true
          schema: {type: string}
        - name: Content-Type
          in: header
          schema: {type: string, example: application/json}
        - name: offset
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pet"}
    post:
      tags: [pet]
      operationId: addPet
      security:
        - petstore_auth: [write:pets]
      requestBody:
        $ref: "#/components/requestBodies/PetBody"
      responses:
        "201":
          description: created
          content:
            application/json:
              example: {name: Rex, id: 7, status: available}
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: ID of the pet
        schema: {type: integer, format: int64, example: 42}
    get:
      tags: [pet]
      summary: Get a pet
      responses:
        "404":
          description: not found
          content:
            application/json:
              example: {code: 404, message: Pet not found}
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
            application/xml:
              schema: {$ref: "#/components/schemas/Pet"}
    delete:
      tags: [pet]
      summary: Delete a pet
      security: []
      responses:
        "204": {description: deleted}
  /store/inventory:
    get:
      tags: [store, pet]
      summary: Inventory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              examples:
                small:
                  summary: Small store
                  value: {sold: 1, available: 2}
                big:
                  $ref: "#/components/examples/BigInventory"
  /user/login:
    post:
      tags: [user]
      summary: Log in
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username: {type: string, example: alice}
                password: {type: string, format: password}
                avatar: {type: string, format: binary}
      responses:
        "200": {description: ok}
  /upload:
    post:
      summary: Upload a file
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note: {type: string}
                file: {type: string, format: binary}
      responses:
        "200": {description: ok}
  /health:
    get:
      responses:
        "200":
          description: ok
          content:
            text/plain:
              example: OK
components:
  requestBodies:
    PetBody:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Pet"}
  examples:
    BigInventory:
      value: {sold: 100, available: 200}
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    petstore_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            write:pets: modify pets
            read:pets: read pets
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: {type: integer, format: int64, readOnly: true}
        name: {type: string, example: doggie}
        status: {type: string, enum: [available, pending, sold]}
        tags:
          type: array
          items: {$ref: "#/components/schemas/Tag"}
        createdAt: {type: string, format: date-time}
    Tag:
      type: object
      properties:
        name: {type: string}
        id: {type: integer}
