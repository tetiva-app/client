      modified: 1669986566981
      isPrivate: false
      sortKey: -1638200268676
    body:
      text: |-
        {
        	"message": "{{ _.greeting }}"
        }
    metadata:
      - name: x-crew
        value: "{{ _.crew_id }}"
    protoFileId: pf_5ec276c683544562935672a39ed2abe7
    protoMethodName: /routeguide.RouteGuide/RouteChat
    reflectionApi:
      enabled: false
      url: https://buf.build
      apiKey: ""
      module: buf.build/connectrpc/eliza
  - url: "{{ _.base_url }}/graphql"
    name: Departures
    meta:
      id: req_d7540e876f894c07969fa8b8616d7923
      created: 1655289826760
      modified: 1655289849596
      isPrivate: false
      sortKey: -1655289826760
    method: POST
    body:
      mimeType: application/graphql
      text: '{"query":"query($airport: String) {\n\tdepartures(airport: $airport) { number }\n}", "variables": "{ \"airport\": \"{{ _.origin }}\" }"}'
    headers:
      - name: Content-Type
        value: application/json
    authentication:
      type: hawk
      id: hawk-id
      key: hawk-key
      algorithm: sha256
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: http://localhost:4010/socket.io
    name: Chat
    meta:
      id: socketio-req_7f1e2d3c4b5a69788796a5b4c3d2e1f0
      created: 1661942202873
      modified: 1661942223227
    settings:
      encodeUrl: true
      cookies:
        send: true
        store: true
    eventListeners:
      - id: listener_1
        eventName: message
