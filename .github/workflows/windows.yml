name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Sign with the release certificate (approve both requests in SignPath)
        type: boolean
        default: false

permissions:
  contents: read

env:
  SIGNING_POLICY: ${{ inputs.release && 'release-signing' || 'test-signing' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: signpath
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: bash build/check-versions.sh

      - id: version
        run: echo "version=$(grep -o 'AppVersion *= *"[^"]*"' internal/constants/app.go | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install wails3 and NSIS
        run: |
          # CGO off: the CLI pulls in a GTK4 probe that does not build on the runner.
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          sudo apt-get update
          sudo apt-get install -y nsis

      - run: bash build/release-windows.sh exes

      - name: Release binary has no test key
        run: |
          if grep -qaF "$(cat build/updatesign/testdata/test-public.b64)" bin/client-amd64.exe; then
            echo "bin/client-amd64.exe carries the updatetest public key"
            exit 1
          fi

      - id: unsigned-exes
        uses: actions/upload-artifact@v7
        with:
          name: windows-exes-unsigned
          path: bin/client-*.exe
          if-no-files-found: error
          retention-days: 1

      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 8701db97-7f65-4507-98dd-14b32bfedd88
          project-slug: client
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: bin

      - run: bash build/release-windows.sh installers

      - id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: bin/Tetiva-*-installer.exe
          if-no-files-found: error
          retention-days: 1

      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 8701db97-7f65-4507-98dd-14b32bfedd88
          project-slug: client
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: bin

      - uses: actions/attest@v4
        with:
          subject-path: bin/Tetiva-*-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers-${{ env.SIGNING_POLICY }}
          path: bin/Tetiva-*-installer.exe
          if-no-files-found: error

      - name: Build the update-cycle pair
        run: |
          K=$(cat build/updatesign/testdata/test-public.b64)
          TAGS=production,updatetest OUT_SUFFIX=-updatetest bash build/release-windows.sh
          grep -qaF "$K" bin/client-amd64-updatetest.exe
          cp -r . "$RUNNER_TEMP/b"
          (
            cd "$RUNNER_TEMP/b"
            bash build/set-version.sh 99.0.0
            TAGS=production,updatetest bash build/release-windows.sh
            go run ./build/updatesign sign --version 99.0.0 --dir bin \
              --key-file build/updatesign/testdata/test-key.b64 \
              --base-url http://127.0.0.1:8765/ --out bin/latest.json
          )
          mkdir -p bin/served
          cp "$RUNNER_TEMP"/b/bin/Tetiva-99.0.0-windows-*-installer.exe "$RUNNER_TEMP/b/bin/latest.json" bin/served/
          cp "$RUNNER_TEMP/b/bin/client-amd64.exe" bin/client-b-amd64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-updatetest
          path: |
            bin/Tetiva-*-installer-updatetest.exe
            bin/served/**
            bin/client-b-amd64.exe
          if-no-files-found: error

  smoke:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-installers-${{ env.SIGNING_POLICY }}

      - run: ./build/windows/smoke.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -SigningPolicy $env:SIGNING_POLICY

  update-cycle:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-updatetest

      - run: ./build/windows/update-cycle.ps1 -Arch amd64 -Version $env:VERSION
