      modified: 1779816364828
      sortKey: -1779816124318
      description: Search and manage flights.
    children:
      - url: "{{ _.base_url }}/flights/:flightId"
        name: Get flight
        meta:
          id: req_70759093fbcf498996c1da257b8e6f8b
          created: 1779816145656
          modified: 1779816330205
          isPrivate: false
          description: Returns one flight.
          sortKey: -1779816145656
        method: GET
        parameters:
          - name: include
            value: crew
            disabled: false
          - name: verbose
            value: "true"
            disabled: true
        pathParameters:
          - name: flightId
            value: "{{ _.default_flight }}"
        headers:
          - name: Authorization
            value: Bearer {{ _.auth_token }}
            disabled: false
        scripts:
          afterResponse: |-
            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.status).to.eql(200);
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/flights"
        name: Add flight
        meta:
          id: req_ba5048ee5a0248d18f1b27cd82ecc6c9
          created: 1778267676046
          modified: 1778267676046
          isPrivate: false
          description: ""
          sortKey: -1778267676046
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "number": "IA{% prompt 'Flight number', '', '101' %}",
              "origin": "{{ _.origin }}"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: basic
          useISO88591: false
          username: "{{ _['ops-user'] }}"
          password: ""
          disabled: false
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
    scripts:
      preRequest: |-
        insomnia.environment.set('started', Date.now());
    authentication:
      type: apikey
      key: X-Api-Key
      value: "{{ _.vault.api_key }}"
      addTo: queryParams
      disabled: false
    environment:
      origin: YYZ
    environmentPropertyOrder:
      "&":
        - origin
  - url: wss://{{ _.ws_host }}/boarding
    name: Boarding updates
    meta:
      id: ws-req_89505c5538ea4130b3075b5cfa379f0a
